name: compile

# Every .py of the plugin must compile on Python 2.7 (this fork still runs on
# Python 2 images, e.g. VTi) and on the Python 3 versions of the images.

on:
  push:
    branches: [ master ]
  pull_request:
    branches:
      - "*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python2:
    name: Python 2.7
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # setup-python has no 2.7 any more: compile in the python:2.7 image
      - name: Compile, python 2.7
        run: docker run --rm -v "$PWD:/src" -w /src/IPTVPlayer python:2.7-slim python -m compileall -q .

  python3:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ['3.9', '3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true

      - name: Compile, python ${{ matrix.python }}
        run: |
          cd IPTVPlayer
          python -m compileall -q .
